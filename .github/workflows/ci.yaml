name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run check && bun run test
        working-directory: servo-ident/web

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dderg/kalico
          ref: sota-motion
          path: kalico
          token: ${{ github.token }}
      - name: fall back to the extraction branch until kalico#313 merges the servo_axis seam
        run: |
          if ! grep -q "def belt_pair" klippy/extras/servo_axis.py; then
            git fetch --depth 1 origin servo-cal-dashboard-extraction
            git checkout FETCH_HEAD
            echo "sota-motion lacks servo_axis.belt_pair; using servo-cal-dashboard-extraction"
          fi
        working-directory: kalico
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/build-native.sh --config-only
        working-directory: kalico
      - run: KALICO_ROOT=$GITHUB_WORKSPACE/kalico uv run --project kalico python -m pytest tests/ -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check klippy_extras tests
      - run: uvx ruff format --check klippy_extras tests
